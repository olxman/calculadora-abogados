name: Bug report
description: Report a problem with the calculator, quotes, or the live demo
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include client secrets, passwords, or private case files.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      description: For example https://olxman.github.io/calculadora-abogados/ or a local file.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 133 on Windows 11, Chrome on Android, Safari on iPhone...
  - type: textarea
    id: extras
    attributes:
      label: Screenshots or extra context
      description: Optional. Drag images here if they help.
